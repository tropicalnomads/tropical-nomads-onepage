AWSTemplateFormatVersion: "2010-09-09"
Description: Amplify app for the new Tropical Nomads web app. No production domain and no repository token.

Resources:
  WebApp:
    Type: AWS::Amplify::App
    Properties:
      Name: tropical-nomads-web
      Description: New web application. This is not the one-pager and it has no production domain.
      Platform: WEB_COMPUTE
      BuildSpec: |
        version: 1
        applications:
          - appRoot: apps/web
            frontend:
              phases:
                preBuild:
                  commands:
                    - npm install -g pnpm@9.15.9
                    - cd ../..
                    - pnpm install --frozen-lockfile
                build:
                  commands:
                    - pnpm --filter tropical-nomads-web build
              artifacts:
                baseDirectory: .next
                files:
                  - "**/*"
              cache:
                paths:
                  - node_modules/**/*
                  - ../../node_modules/**/*
      EnvironmentVariables:
        - Name: AMPLIFY_MONOREPO_APP_ROOT
          Value: apps/web
        - Name: NEXT_TELEMETRY_DISABLED
          Value: "1"
      Tags:
        - Key: Name
          Value: tropical-nomads-web

Outputs:
  AppId:
    Value: !GetAtt WebApp.AppId
  AppName:
    Value: !GetAtt WebApp.AppName
