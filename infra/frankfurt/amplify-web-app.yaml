AWSTemplateFormatVersion: "2010-09-09"
Description: Amplify app for the new Tropical Nomads web app. No production domain and no repository token.

Parameters:
  CognitoUserPoolId:
    Type: String
    Description: Deployed user pool id. Do not commit the value.
    NoEcho: true
  CognitoClientId:
    Type: String
    Description: Deployed app client id. The client has no secret.
    NoEcho: true

Resources:
  WebApp:
    Type: AWS::Amplify::App
    Properties:
      Name: tropical-nomads-web
      Description: New web application. This is not the one-pager and it has no production domain.
      Platform: WEB_COMPUTE
      BuildSpec: |
        version: 1
        applications:
          - appRoot: apps/web
            frontend:
              phases:
                preBuild:
                  commands:
                    - nvm install 24.22.2
                    - nvm use 24.22.2
                    - node --version
                    - npm install -g pnpm@12.18.0
                    - pnpm --version
                    - cd ../..
                    - pnpm install --frozen-lockfile
                build:
                  commands:
                    - pnpm --filter tropical-nomads-web build
              artifacts:
                baseDirectory: .next
                files:
                  - "**/*"
              cache:
                paths:
                  - node_modules/**/*
                  - ../../node_modules/**/*
      EnvironmentVariables:
        - Name: AMPLIFY_MONOREPO_APP_ROOT
          Value: apps/web
        - Name: NEXT_TELEMETRY_DISABLED
          Value: "1"
        - Name: COGNITO_USER_POOL_ID
          Value: !Ref CognitoUserPoolId
        - Name: COGNITO_CLIENT_ID
          Value: !Ref CognitoClientId
      Tags:
        - Key: Name
          Value: tropical-nomads-web

Outputs:
  AppId:
    Value: !GetAtt WebApp.AppId
  AppName:
    Value: !GetAtt WebApp.AppName
