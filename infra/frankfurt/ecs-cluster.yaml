AWSTemplateFormatVersion: "2010-09-09"
Description: Fargate cluster for the Tropical Nomads API.

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: tropical-nomads
      CapacityProviders:
        - FARGATE
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      Tags:
        - Key: Name
          Value: tropical-nomads

Outputs:
  ClusterName:
    Value: !Ref Cluster
