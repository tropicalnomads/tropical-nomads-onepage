AWSTemplateFormatVersion: "2010-09-09"
Description: Private image repository for the Tropical Nomads API. The last 10 images are kept.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: tropical-nomads-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: tropical-nomads-api

Outputs:
  RepositoryName:
    Value: !Ref Repository
