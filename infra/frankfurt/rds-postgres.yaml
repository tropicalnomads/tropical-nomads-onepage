AWSTemplateFormatVersion: "2010-09-09"
Description: Private single-AZ PostgreSQL for Tropical Nomads. The master password is created in Secrets Manager and is not in this file.

Parameters:
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetB:
    Type: AWS::EC2::Subnet::Id
  DbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: tropical-nomads-frankfurt
      DBSubnetGroupDescription: Private subnets for one PostgreSQL instance.
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      Tags:
        - Key: Name
          Value: tropical-nomads-frankfurt

  ParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      DBParameterGroupName: tropical-nomads-frankfurt
      Description: Require TLS to tropical-nomads-frankfurt.
      Family: postgres16
      Parameters:
        rds.force_ssl: "1"
      Tags:
        - Key: Name
          Value: tropical-nomads-frankfurt

  Database:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3010
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: tropical-nomads-frankfurt
      Engine: postgres
      EngineVersion: "16.15"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      AvailabilityZone: eu-central-1a
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref SubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroupId
      DBParameterGroupName: !Ref ParameterGroup
      MasterUsername: tn_app
      ManageMasterUserPassword: true
      BackupRetentionPeriod: 7
      PreferredBackupWindow: "01:00-01:30"
      PreferredMaintenanceWindow: "sun:03:00-sun:04:00"
      CopyTagsToSnapshot: true
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: false
      MonitoringInterval: 0
      EnableCloudwatchLogsExports:
        - postgresql
      CACertificateIdentifier: rds-ca-rsa2048-g1
      Tags:
        - Key: Name
          Value: tropical-nomads-frankfurt

Outputs:
  DbSecretArn:
    Description: Secrets Manager ARN generated by RDS. The password is not an output.
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  DbInstanceIdentifier:
    Value: !Ref Database
