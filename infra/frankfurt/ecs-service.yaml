AWSTemplateFormatVersion: "2010-09-09"
Description: One Fargate task for the Tropical Nomads API. A public IP is outbound only. API Gateway reaches port 8787.

Parameters:
  ClusterName:
    Type: String
  TaskDefinitionArn:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
  ApiSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: tropical-nomads.local
      Description: Private discovery for the API task.
      Vpc: !Ref VpcId

  ApiDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: api-srv
      NamespaceId: !Ref Namespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: SRV
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: tropical-nomads-api
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref TaskDefinitionArn
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableExecuteCommand: false
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      ServiceRegistries:
        - RegistryArn: !GetAtt ApiDiscovery.Arn
          Port: 8787
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ApiSecurityGroupId
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: tropical-nomads-api

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  DiscoveryServiceArn:
    Value: !GetAtt ApiDiscovery.Arn
