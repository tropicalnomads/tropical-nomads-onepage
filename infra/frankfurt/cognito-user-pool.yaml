AWSTemplateFormatVersion: "2010-09-09"
Description: Cognito user pool for the new Tropical Nomads web app. Email sign-in. Google, Apple, and the hosted UI are created only when their parameters are set.

Parameters:
  DomainPrefix:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9-]{1,63}$"
  CallbackUrl:
    Type: String
    Default: ""
  GoogleClientId:
    Type: String
    Default: ""
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""
  AppleServicesId:
    Type: String
    Default: ""
  AppleTeamId:
    Type: String
    Default: ""
  AppleKeyId:
    Type: String
    Default: ""
  ApplePrivateKey:
    Type: String
    NoEcho: true
    Default: ""

Conditions:
  UseDomain: !Not [!Equals [!Ref DomainPrefix, ""]]
  UseHostedUi: !Not [!Equals [!Ref CallbackUrl, ""]]
  UseGoogle: !And
    - !Not [!Equals [!Ref GoogleClientId, ""]]
    - !Not [!Equals [!Ref GoogleClientSecret, ""]]
  UseApple: !And
    - !Not [!Equals [!Ref AppleServicesId, ""]]
    - !Not [!Equals [!Ref AppleTeamId, ""]]
    - !Not [!Equals [!Ref AppleKeyId, ""]]
    - !Not [!Equals [!Ref ApplePrivateKey, ""]]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: tropical-nomads-web
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      DeletionProtection: ACTIVE
      UserPoolTags:
        Name: tropical-nomads-web

  HostedDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: UseDomain
    Properties:
      Domain: !Ref DomainPrefix
      UserPoolId: !Ref UserPool

  GoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: UseGoogle
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref UserPool
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name

  AppleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: UseApple
    Properties:
      ProviderName: SignInWithApple
      ProviderType: SignInWithApple
      UserPoolId: !Ref UserPool
      ProviderDetails:
        client_id: !Ref AppleServicesId
        team_id: !Ref AppleTeamId
        key_id: !Ref AppleKeyId
        private_key: !Ref ApplePrivateKey
        authorize_scopes: email name
      AttributeMapping:
        email: email

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: tropical-nomads-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders: !If
        - UseGoogle
        - !If
          - UseApple
          - - COGNITO
            - !Ref GoogleProvider
            - !Ref AppleProvider
          - - COGNITO
            - !Ref GoogleProvider
        - !If
          - UseApple
          - - COGNITO
            - !Ref AppleProvider
          - - COGNITO
      CallbackURLs: !If
        - UseHostedUi
        - - !Ref CallbackUrl
          - http://127.0.0.1:3100/account/callback
        - !Ref AWS::NoValue
      AllowedOAuthFlowsUserPoolClient: !If [UseHostedUi, true, false]
      AllowedOAuthFlows: !If
        - UseHostedUi
        - - code
        - !Ref AWS::NoValue
      AllowedOAuthScopes: !If
        - UseHostedUi
        - - openid
          - email
          - profile
        - !Ref AWS::NoValue
      EnableTokenRevocation: true
      AuthSessionValidity: 3
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Configures events, tickets, shop, prices, sizes, and stock.
      Precedence: 1
      UserPoolId: !Ref UserPool

  DoorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: door
      Description: Checks people in by scanning QR codes.
      Precedence: 2
      UserPoolId: !Ref UserPool

  UserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: user
      Description: Sees their own purchases and tickets.
      Precedence: 3
      UserPoolId: !Ref UserPool

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref WebClient
