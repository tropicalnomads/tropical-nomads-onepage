AWSTemplateFormatVersion: "2010-09-09"
Description: Cognito user pool for the new Tropical Nomads web app. Email sign-in. Google, Apple, and the hosted UI are created only when their parameters are set.

Parameters:
  DomainPrefix:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9-]{1,63}$"
  CallbackUrl:
    Type: String
    Default: ""
  GoogleClientId:
    Type: String
    Default: ""
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""
  AppleServicesId:
    Type: String
    Default: ""
  AppleTeamId:
    Type: String
    Default: ""
  AppleKeyId:
    Type: String
    Default: ""
  ApplePrivateKey:
    Type: String
    NoEcho: true
    Default: ""

Conditions:
  UseDomain: !Not [!Equals [!Ref DomainPrefix, ""]]
  UseHostedUi: !Not [!Equals [!Ref CallbackUrl, ""]]
  UseGoogle: !And
    - !Not [!Equals [!Ref GoogleClientId, ""]]
    - !Not [!Equals [!Ref GoogleClientSecret, ""]]
  UseApple: !And
    - !Not [!Equals [!Ref AppleServicesId, ""]]
    - !Not [!Equals [!Ref AppleTeamId, ""]]
    - !Not [!Equals [!Ref AppleKeyId, ""]]
    - !Not [!Equals [!Ref ApplePrivateKey, ""]]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DependsOn: GoogleLinkPermission
    Properties:
      UserPoolName: tropical-nomads-web
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      DeletionProtection: ACTIVE
      LambdaConfig:
        PreSignUp: !GetAtt GoogleLinkFunction.Arn
      UserPoolTags:
        Name: tropical-nomads-web

  HostedDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: UseDomain
    Properties:
      Domain: !Ref DomainPrefix
      UserPoolId: !Ref UserPool

  GoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: UseGoogle
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref UserPool
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        given_name: given_name
        family_name: family_name
        name: name
        picture: picture
        locale: locale

  AppleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: UseApple
    Properties:
      ProviderName: SignInWithApple
      ProviderType: SignInWithApple
      UserPoolId: !Ref UserPool
      ProviderDetails:
        client_id: !Ref AppleServicesId
        team_id: !Ref AppleTeamId
        key_id: !Ref AppleKeyId
        private_key: !Ref ApplePrivateKey
        authorize_scopes: email name
      AttributeMapping:
        email: email

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: tropical-nomads-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders: !If
        - UseGoogle
        - !If
          - UseApple
          - - COGNITO
            - !Ref GoogleProvider
            - !Ref AppleProvider
          - - COGNITO
            - !Ref GoogleProvider
        - !If
          - UseApple
          - - COGNITO
            - !Ref AppleProvider
          - - COGNITO
      CallbackURLs: !If
        - UseHostedUi
        - - !Ref CallbackUrl
          - http://127.0.0.1:3100/account/callback
        - !Ref AWS::NoValue
      AllowedOAuthFlowsUserPoolClient: !If [UseHostedUi, true, false]
      AllowedOAuthFlows: !If
        - UseHostedUi
        - - code
        - !Ref AWS::NoValue
      AllowedOAuthScopes: !If
        - UseHostedUi
        - - openid
          - email
          - profile
        - !Ref AWS::NoValue
      EnableTokenRevocation: true
      AuthSessionValidity: 3
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Configures events, tickets, shop, prices, sizes, and stock.
      Precedence: 1
      UserPoolId: !Ref UserPool

  DoorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: door
      Description: Checks people in by scanning QR codes.
      Precedence: 2
      UserPoolId: !Ref UserPool

  UserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: user
      Description: Sees their own purchases and tickets.
      Precedence: 3
      UserPoolId: !Ref UserPool

  GoogleLinkRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: link-google-signup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminLinkProviderForUser
                Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  GoogleLinkFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tropical-nomads-link-google
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt GoogleLinkRole.Arn
      Code:
        ZipFile: |
          const crypto=require('crypto');
          function linkDecision(input){
            if(input.trigger!=='PreSignUp_ExternalProvider')return{action:'ignore'};
            const userName=String(input.userName||'');
            const subject=userName.toLowerCase().startsWith('google_')?userName.slice(7):'';
            if(!/^[A-Za-z0-9:._-]{1,200}$/.test(subject))return{action:'ignore'};
            const email=String(input.email||'').trim().toLowerCase();
            if(!email.includes('@'))return{action:'ignore'};
            const matches=(input.users||[]).filter((user)=>user.emailVerified===true&&String(user.email||'').toLowerCase()===email&&user.username!==userName);
            if(matches.length===1)return{action:'link',username:matches[0].username,subject};
            if(matches.length>1)return{action:'ignore'};
            return{action:'confirm'};
          }
          function hmac(key,data){return crypto.createHmac('sha256',key).update(data).digest()}
          function sha(data){return crypto.createHash('sha256').update(data).digest('hex')}
          async function post(target,body){
            const region=process.env.AWS_REGION,host='cognito-idp.'+region+'.amazonaws.com',amz=new Date().toISOString().replace(/[:-]|\.\d{3}/g,''),day=amz.slice(0,8),payload=JSON.stringify(body),token=process.env.AWS_SESSION_TOKEN||'';
            const names=['content-type','host','x-amz-date','x-amz-security-token','x-amz-target'];
            const values=['application/x-amz-json-1.1',host,amz,token,target];
            const canonical=['POST','/','',names.map((name,index)=>name+':'+values[index]).join('\n')+'\n',names.join(';'),sha(payload)].join('\n');
            const scope=day+'/'+region+'/cognito-idp/aws4_request';
            let key=hmac('AWS4'+process.env.AWS_SECRET_ACCESS_KEY,day);
            key=hmac(key,region);key=hmac(key,'cognito-idp');key=hmac(key,'aws4_request');
            const response=await fetch('https://'+host+'/',{method:'POST',headers:{'content-type':values[0],'x-amz-date':amz,'x-amz-security-token':token,'x-amz-target':target,authorization:'AWS4-HMAC-SHA256 Credential='+process.env.AWS_ACCESS_KEY_ID+'/'+scope+', SignedHeaders='+names.join(';')+', Signature='+crypto.createHmac('sha256',key).update(['AWS4-HMAC-SHA256',amz,scope,sha(canonical)].join('\n')).digest('hex')},body:payload});
            const text=await response.text();
            if(!response.ok)throw new Error(text.slice(0,300));
            return text?JSON.parse(text):{};
          }
          exports.linkDecision=linkDecision;
          exports.handler=async(event)=>{
            const email=String(event.request&&event.request.userAttributes&&event.request.userAttributes.email||'');
            let users=[];
            if(event.triggerSource==='PreSignUp_ExternalProvider'){
              const body=await post('AWSCognitoIdentityProviderService.ListUsers',{UserPoolId:event.userPoolId,Filter:'email = "'+email.replace(/["\\]/g,'').trim()+'"',Limit:20});
              users=(Array.isArray(body.Users)?body.Users:[]).map((user)=>{
                const attributes=Array.isArray(user.Attributes)?user.Attributes:[];
                const read=(name)=>{const found=attributes.find((item)=>item.Name===name);return found&&typeof found.Value==='string'?found.Value:'';};
                return{username:String(user.Username||''),email:read('email'),emailVerified:read('email_verified')==='true'};
              });
            }
            const decision=linkDecision({trigger:event.triggerSource,userName:event.userName,email,users});
            if(decision.action==='confirm'){event.response.autoConfirmUser=true;event.response.autoVerifyEmail=true;return event;}
            if(decision.action!=='link')return event;
            try{await post('AWSCognitoIdentityProviderService.AdminLinkProviderForUser',{UserPoolId:event.userPoolId,DestinationUser:{ProviderName:'Cognito',ProviderAttributeValue:decision.username},SourceUser:{ProviderName:'Google',ProviderAttributeName:'Cognito_Subject',ProviderAttributeValue:decision.subject}});}
            catch(error){if(!/already/i.test(String(error&&error.message?error.message:error)))throw error;}
            throw new Error('ACCOUNT_LINKED');
          };

  GoogleLinkPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GoogleLinkFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref WebClient
