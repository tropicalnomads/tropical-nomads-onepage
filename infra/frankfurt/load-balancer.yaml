AWSTemplateFormatVersion: "2010-09-09"
Description: API load balancer. HTTPS for api-dev.tropical-nomads.com forwards to the API target group. www is not attached.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  CertificateArn:
    Type: String
    Description: DNS-validated certificate for api-dev.tropical-nomads.com. Do not commit the value.
    AllowedPattern: "^arn:aws:acm:eu-central-1:[0-9]{12}:certificate/.+"
    NoEcho: true

Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: tropical-nomads-api
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: tropical-nomads-api

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: tropical-nomads-api
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8787
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: "8787"
      HealthCheckPath: /health
      Matcher:
        HttpCode: "200"
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: tropical-nomads-api

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  LoadBalancerArn:
    Value: !Ref LoadBalancer
  TargetGroupArn:
    Value: !Ref TargetGroup
