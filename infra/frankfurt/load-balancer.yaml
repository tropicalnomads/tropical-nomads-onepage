AWSTemplateFormatVersion: "2010-09-09"
Description: API load balancer without a listener. A certificate waits until a hostname is chosen, so this file does not publish the API.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: tropical-nomads-api
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: tropical-nomads-api

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: tropical-nomads-api
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8787
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: "8787"
      HealthCheckPath: /health
      Matcher:
        HttpCode: "200"
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: tropical-nomads-api

Outputs:
  LoadBalancerArn:
    Value: !Ref LoadBalancer
  TargetGroupArn:
    Value: !Ref TargetGroup
