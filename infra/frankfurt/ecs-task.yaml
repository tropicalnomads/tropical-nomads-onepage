AWSTemplateFormatVersion: "2010-09-09"
Description: One Fargate task for the Tropical Nomads API. 0.25 vCPU and 0.5 GB. The database password comes from Secrets Manager.

Parameters:
  ExecutionRoleArn:
    Type: String
  TaskRoleArn:
    Type: String
  Image:
    Type: String
    Description: API image URI. Do not commit the value.
    NoEcho: true
  LogGroupName:
    Type: String
  DbSecretArn:
    Type: String
    Description: RDS secret ARN. Do not commit the value.
    NoEcho: true
  DbHost:
    Type: String
    Description: RDS endpoint hostname. Do not commit the value.
    NoEcho: true
  SessionSecretArn:
    Type: String
    Description: Session secret ARN. Do not commit the value.
    AllowedPattern: "^arn:aws:secretsmanager:eu-central-1:[0-9]{12}:secret:.+"
    NoEcho: true
  AssetsBucketName:
    Type: String
    Description: Private assets bucket name. Do not commit the value.
    AllowedPattern: "^tropical-nomads-assets-[0-9]{12}$"
    NoEcho: true
  UserPoolId:
    Type: String
    Description: Cognito user pool deleted with an account. Do not commit the value.
    AllowedPattern: "^eu-central-1_[A-Za-z0-9]+$"
    NoEcho: true

Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: tropical-nomads-api
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: api
          Image: !Ref Image
          Essential: true
          User: "1000"
          PortMappings:
            - ContainerPort: 8787
              Protocol: tcp
          Environment:
            - Name: API_HOSTNAME
              Value: 0.0.0.0
            - Name: API_PORT
              Value: "8787"
            - Name: DB_HOST
              Value: !Ref DbHost
            - Name: DB_PORT
              Value: "5432"
            - Name: DB_NAME
              Value: postgres
            - Name: DB_STARTUP_CHECK
              Value: "true"
            - Name: ASSETS_BUCKET
              Value: !Ref AssetsBucketName
            - Name: COGNITO_USER_POOL_ID
              Value: !Ref UserPoolId
            - Name: COGNITO_REGION
              Value: eu-central-1
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub "${DbSecretArn}:username::"
            - Name: DB_PASSWORD
              ValueFrom: !Sub "${DbSecretArn}:password::"
            - Name: ACCOUNT_SESSION_SECRET
              ValueFrom: !Ref SessionSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: eu-central-1
              awslogs-stream-prefix: api
          HealthCheck:
            Command:
              - CMD-SHELL
              - node -e "fetch('http://127.0.0.1:8787/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 40

Outputs:
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
