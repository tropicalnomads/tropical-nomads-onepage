version: 1
# www.tropical-nomads.com publishes only the one-pager package.
# The web app's Amplify app, the API container on ECS, and the database are later hosts. They are not created here.
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@9.15.9
        - pnpm --version
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm --filter tropical-nomads-page build
  artifacts:
    baseDirectory: apps/one-pager/dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
# Amplify defaults to s-maxage=31536000, so CloudFront would keep HTML,
# sw.js and JSON for a year. Hashed Vite assets stay immutable.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, no-store, must-revalidate, max-age=0, s-maxage=0'
  - pattern: '/assets/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
