version: 1
# www.tropical-nomads.com publishes only the one-pager package.
# dev.tropical-nomads.com publishes the web app from the same repository.
# The one-pager publish path stays apps/one-pager/dist.
applications:
  - appRoot: apps/one-pager
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 24.22.2 && nvm alias default 24.22.2 && nvm use 24.22.2
            - node --version
            - npm install -g pnpm@12.18.0
            - pnpm --version
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter tropical-nomads-page build
      artifacts:
        baseDirectory: apps/one-pager/dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .pnpm-store/**/*
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 24.22.2 && nvm alias default 24.22.2 && nvm use 24.22.2
            - node --version
            - npm install -g pnpm@12.18.0
            - pnpm --version
            - pnpm install --frozen-lockfile
        build:
          commands:
            - nvm use 24.22.2 && node --version
            - pnpm --filter tropical-nomads-web build
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .pnpm-store/**/*
# Amplify defaults to s-maxage=31536000, so CloudFront would keep HTML,
# sw.js and JSON for a year. Hashed Vite assets stay immutable.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, no-store, must-revalidate, max-age=0, s-maxage=0'
  - pattern: '/assets/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
