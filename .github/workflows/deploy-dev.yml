# Push to dev rolls the API image.
# Amplify's own dev-branch build publishes the web app. This workflow does not start a second one.
# The one-pager publish stays in amplify.yml.
name: Deploy dev

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::624248574874:role/tropical-nomads-github-dev-deploy
          aws-region: eu-central-1

      - name: Build and roll the API
        id: api
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="${account}.dkr.ecr.eu-central-1.amazonaws.com"
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin "$registry"
          image="${registry}/tropical-nomads-api:${GITHUB_SHA}"
          if aws ecr describe-images --repository-name tropical-nomads-api --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "api image already exists"
          else
            docker build -f apps/api/Dockerfile -t "$image" .
            docker push "$image"
          fi
          node scripts/roll-api-image.mjs --image "$image"
