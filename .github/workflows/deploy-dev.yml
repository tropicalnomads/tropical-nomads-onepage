# Push to dev deploys the web app and rolls the API.
# The one-pager publish stays in amplify.yml. This workflow does not change it.
name: Deploy dev

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::624248574874:role/tropical-nomads-github-dev-deploy
          aws-region: eu-central-1

      - name: Start web deploy
        id: web
        run: |
          set -euo pipefail
          job_id=""
          attempt=1
          while [[ "$attempt" -le 5 ]]; do
            if job_id=$(aws amplify start-job \
              --app-id d3rt3rqkclbrw5 \
              --branch-name dev \
              --job-type RELEASE \
              --commit-id "$GITHUB_SHA" \
              --commit-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --job-reason "deploy ${GITHUB_SHA}" \
              --query jobSummary.jobId \
              --output text); then
              job_id="${job_id//$'\n'/}"
              job_id="${job_id// /}"
              if [[ -n "$job_id" && "$job_id" != "None" ]]; then
                break
              fi
            fi
            job_id=""
            if [[ "$attempt" -eq 5 ]]; then
              echo "Amplify did not start a job." >&2
              exit 1
            fi
            sleep 10
            attempt=$((attempt + 1))
          done
          echo "job_id=${job_id}" >> "$GITHUB_OUTPUT"
          echo "amplify job ${job_id}"

      - name: Build and roll the API
        id: api
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="${account}.dkr.ecr.eu-central-1.amazonaws.com"
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin "$registry"
          image="${registry}/tropical-nomads-api:${GITHUB_SHA}"
          if aws ecr describe-images --repository-name tropical-nomads-api --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "api image already exists"
          else
            docker build -f apps/api/Dockerfile -t "$image" .
            docker push "$image"
          fi
          node scripts/roll-api-image.mjs --image "$image"

      - name: Wait for the web deploy
        if: always() && steps.web.outputs.job_id != ''
        run: |
          set -euo pipefail
          job_id="${{ steps.web.outputs.job_id }}"
          for _ in $(seq 1 80); do
            status=$(aws amplify get-job \
              --app-id d3rt3rqkclbrw5 \
              --branch-name dev \
              --job-id "$job_id" \
              --query job.summary.status \
              --output text)
            echo "amplify status ${status}"
            case "$status" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED)
                echo "Amplify job ${status}." >&2
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Amplify job timed out." >&2
          exit 1
